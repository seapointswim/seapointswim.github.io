name: Refresh sea conditions and publish Seapoint Swim

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 15 min, offset away from the busy top of the hour (UTC).
    - cron: '8,23,38,53 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: seapoint-swim-pages
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify static-site code
        run: npm test

      - name: Fetch marine and weather data
        run: node scripts/update-data.js

      - name: Verify generated snapshot
        run: node scripts/check-snapshot.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
